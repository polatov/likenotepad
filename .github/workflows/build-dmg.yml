# Builds an unsigned universal (Apple Silicon + Intel) .dmg. On a version tag (v*) it also
# publishes a GitHub Release with the .dmg attached (the Homebrew tap picks it up from
# there); run manually, it only keeps the .dmg as a run artifact.
name: Build DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Write access is only needed to create the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run build -- --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: LikeNotepad.exe-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          sum=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          cat > notes.md <<EOF
          Universal build for Apple Silicon and Intel Macs.

          **Install:** open the .dmg and drag LikeNotepad.exe to Applications, or
          \`brew install --cask polatov/tap/likenotepad\`.

          **First launch:** the app is not signed with an Apple Developer ID yet, so macOS
          blocks it the first time. Open System Settings → Privacy & Security and click
          **Open Anyway** next to the message about LikeNotepad.exe (once).

          SHA-256: \`$sum\`
          EOF
          gh release create "$GITHUB_REF_NAME" "$dmg" --title "LikeNotepad.exe ${GITHUB_REF_NAME#v}" --notes-file notes.md
