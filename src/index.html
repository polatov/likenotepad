<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --text: #000000;
    --status-bg: #f0f0f0;
    --status-border: #d0d0d0;
    --status-text: #555555;
    --editor-bg: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #1e1e1e;
      --text: #d4d4d4;
      --status-bg: #252526;
      --status-border: #3a3a3a;
      --status-text: #888888;
      --editor-bg: #1e1e1e;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1e1e1e;
    --text: #d4d4d4;
    --status-bg: #252526;
    --status-border: #3a3a3a;
    --status-text: #888888;
    --editor-bg: #1e1e1e;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #editor {
    flex: 1;
    width: 100%;
    padding: 12px 14px;
    border: none;
    outline: none;
    resize: none;
    background: var(--editor-bg);
    color: var(--text);
    font-family: "Menlo", "Monaco", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
    tab-size: 4;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }

  #editor::selection {
    background: #4d90fe;
    color: #ffffff;
  }

  #statusbar {
    flex-shrink: 0;
    height: 22px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    background: var(--status-bg);
    border-top: 1px solid var(--status-border);
    color: var(--status-text);
    font-size: 11px;
    user-select: none;
  }
</style>
</head>
<body>
<textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
<div id="statusbar">
  <span id="stat-words"></span>
  <span id="stat-chars"></span>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
