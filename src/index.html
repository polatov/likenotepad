<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LikeNotepad.exe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --text: #000000;
    --status-bg: #f0f0f0;
    --status-border: #d0d0d0;
    --status-text: #555555;
    --editor-bg: #ffffff;
    --accent: #007AFF;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #1e1e1e;
      --text: #d4d4d4;
      --status-bg: #252526;
      --status-border: #3a3a3a;
      --status-text: #888888;
      --editor-bg: #1e1e1e;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1e1e1e;
    --text: #d4d4d4;
    --status-bg: #252526;
    --status-border: #3a3a3a;
    --status-text: #888888;
    --editor-bg: #1e1e1e;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #editor {
    flex: 1;
    width: 100%;
    padding: 12px 14px;
    border: none;
    outline: none;
    resize: none;
    background: var(--editor-bg);
    color: var(--text);
    font-family: "Menlo", "Monaco", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
    tab-size: 4;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }

  #editor::selection {
    background: #4d90fe;
    color: #ffffff;
  }

  #editor-wrap {
    position: relative;
    flex: 1;
    display: flex;
  }

  #findbar {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    padding: 6px 12px;
    background: var(--status-bg);
    border-bottom: 1px solid var(--status-border);
    font-size: 12px;
    color: var(--text);
  }
  #findbar[hidden] { display: none; }
  #findbar-row1, #findbar-row2 {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #findbar-row2[hidden] { display: none; }
  #replace-input {
    flex: 1;
    padding: 3px 6px;
    background: var(--editor-bg);
    color: var(--text);
    border: 1px solid var(--status-border);
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }
  #replace-input:focus { border-color: #4d90fe; }
  #replace-one, #replace-all {
    background: none;
    border: 1px solid var(--status-border);
    border-radius: 4px;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 8px;
  }
  #replace-one:hover, #replace-all:hover { background: var(--status-border); }
  #find-field, #replace-field {
    position: relative;
    flex: 1;
    display: flex;
  }
  #find-input {
    flex: 1;
    padding: 3px 56px 3px 6px;
    background: var(--editor-bg);
    color: var(--text);
    border: 1px solid var(--status-border);
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }
  #find-input:focus { border-color: #4d90fe; }
  #find-count {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--status-text);
    font-size: 11px;
    pointer-events: none;
    user-select: none;
  }
  #find-actions, #replace-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #find-case {
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--status-text);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    line-height: 1;
  }
  #find-case:hover { color: var(--text); }
  #find-case.active {
    border-color: #4d90fe;
    color: var(--text);
  }
  #find-prev, #find-next {
    background: none;
    border: none;
    color: var(--status-text);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 5px;
    line-height: 1;
  }
  #find-prev:hover, #find-next:hover { color: var(--text); }
  #find-close { background: none; border: none; color: var(--status-text); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  #find-close:hover { color: var(--text); }

  #gotobar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--status-bg);
    border-bottom: 1px solid var(--status-border);
    font-size: 12px;
    color: var(--text);
  }
  #gotobar[hidden] { display: none; }
  #goto-input {
    flex: 1;
    max-width: 200px;
    padding: 3px 6px;
    background: var(--editor-bg);
    color: var(--text);
    border: 1px solid var(--status-border);
    border-radius: 4px;
    font-size: 12px;
    outline: none;
    -moz-appearance: textfield;
  }
  #goto-input::-webkit-inner-spin-button,
  #goto-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  #goto-input:focus { border-color: #4d90fe; }
  #goto-close { margin-left: auto; background: none; border: none; color: var(--status-text); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  #goto-close:hover { color: var(--text); }

  #statusbar {
    flex-shrink: 0;
    height: 22px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    background: var(--status-bg);
    border-top: 1px solid var(--status-border);
    color: var(--status-text);
    font-size: 11px;
    user-select: none;
  }
  #stat-spacer { flex: 1; }
  #stat-right {
    display: flex;
    gap: 12px;
  }

</style>
</head>
<body>
<div id="findbar" hidden>
  <div id="findbar-row1">
    <div id="find-field">
      <input id="find-input" type="text" placeholder="Найти" spellcheck="false" autocomplete="off">
      <span id="find-count"></span>
    </div>
    <div id="find-actions">
      <button id="find-prev" title="Предыдущее (⌘⇧G)">‹</button>
      <button id="find-next" title="Следующее (⌘G)">›</button>
      <button id="find-case" title="Учитывать регистр">Aa</button>
      <button id="find-close" title="Закрыть">✕</button>
    </div>
  </div>
  <div id="findbar-row2" hidden>
    <div id="replace-field">
      <input id="replace-input" type="text" placeholder="Заменить на" spellcheck="false" autocomplete="off">
    </div>
    <div id="replace-actions">
      <button id="replace-one">Заменить</button>
      <button id="replace-all">Заменить всё</button>
    </div>
  </div>
</div>
<div id="gotobar" hidden>
  <input id="goto-input" type="number" min="1" placeholder="Номер строки" spellcheck="false" autocomplete="off">
  <button id="goto-close" title="Закрыть">✕</button>
</div>
<div id="editor-wrap">
  <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
</div>
<div id="statusbar">
  <span id="stat-pos"></span>
  <span id="stat-spacer"></span>
  <div id="stat-right">
    <span id="stat-words"></span>
    <span id="stat-chars"></span>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
