<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LikeNotepad.exe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --text: #000000;
    --status-bg: #f0f0f0;
    --status-border: #d0d0d0;
    --status-text: #555555;
    --editor-bg: #ffffff;
    --accent: #007AFF;
    --panel-bg: #f0f0f0;
    --panel-border: #d0d0d0;
    --input-bg: #ffffff;
    --hover-bg: rgba(0,0,0,0.06);
    --text-secondary: #888888;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #1e1e1e;
      --text: #d4d4d4;
      --status-bg: #252526;
      --status-border: #3a3a3a;
      --status-text: #888888;
      --editor-bg: #1e1e1e;
      --panel-bg: #252526;
      --panel-border: #3a3a3a;
      --input-bg: #1e1e1e;
      --hover-bg: rgba(255,255,255,0.06);
      --text-secondary: #888888;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1e1e1e;
    --text: #d4d4d4;
    --status-bg: #252526;
    --status-border: #3a3a3a;
    --status-text: #888888;
    --editor-bg: #1e1e1e;
    --panel-bg: #252526;
    --panel-border: #3a3a3a;
    --input-bg: #1e1e1e;
    --hover-bg: rgba(255,255,255,0.06);
    --text-secondary: #888888;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #editor {
    flex: 1;
    width: 100%;
    padding: 12px 14px;
    border: none;
    outline: none;
    resize: none;
    background: var(--editor-bg);
    color: var(--text);
    font-family: "Menlo", "Monaco", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
    tab-size: 4;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }

  #editor::selection {
    background: #4d90fe;
    color: #ffffff;
  }

  #editor-wrap {
    position: relative;
    flex: 1;
    display: flex;
  }

  #findbar {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    padding: 6px 12px;
    background: var(--status-bg);
    border-bottom: 1px solid var(--status-border);
    font-size: 12px;
    color: var(--text);
  }
  #findbar[hidden] { display: none; }
  #findbar-row1, #findbar-row2 {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #findbar-row2[hidden] { display: none; }
  #replace-input {
    flex: 1;
    padding: 3px 6px;
    background: var(--editor-bg);
    color: var(--text);
    border: 1px solid var(--status-border);
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }
  #replace-input:focus { border-color: #4d90fe; }
  #replace-one, #replace-all {
    background: none;
    border: 1px solid var(--status-border);
    border-radius: 4px;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 8px;
  }
  #replace-one:hover, #replace-all:hover { background: var(--status-border); }
  #find-field, #replace-field {
    position: relative;
    flex: 1;
    display: flex;
  }
  #find-input {
    flex: 1;
    padding: 3px 56px 3px 6px;
    background: var(--editor-bg);
    color: var(--text);
    border: 1px solid var(--status-border);
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }
  #find-input:focus { border-color: #4d90fe; }
  #find-count {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--status-text);
    font-size: 11px;
    pointer-events: none;
    user-select: none;
  }
  #find-actions, #replace-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #find-case {
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--status-text);
    cursor: pointer;
    font-size: 12px;
    /* Асимметричный паддинг опускает «Aa» на полпикселя: без него базовая линия
       заглавных на 0.5px выше, чем у ‹ › (замер в WKWebView @2x). Рамка кнопки
       при этом остаётся на месте. */
    padding: 2.5px 6px 1.5px;
    line-height: 1;
  }
  #find-case:hover { color: var(--text); }
  #find-case.active {
    border-color: #4d90fe;
    color: var(--text);
  }
  #find-prev, #find-next {
    background: none;
    border: none;
    color: var(--status-text);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 5px;
    line-height: 1;
  }
  #find-prev:hover, #find-next:hover { color: var(--text); }
  #find-close { background: none; border: none; color: var(--status-text); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  #find-close:hover { color: var(--text); }

  #gotobar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--status-bg);
    border-bottom: 1px solid var(--status-border);
    font-size: 12px;
    color: var(--text);
  }
  #gotobar[hidden] { display: none; }
  #goto-input {
    flex: 1;
    max-width: 200px;
    padding: 3px 6px;
    background: var(--editor-bg);
    color: var(--text);
    border: 1px solid var(--status-border);
    border-radius: 4px;
    font-size: 12px;
    outline: none;
    -moz-appearance: textfield;
  }
  #goto-input::-webkit-inner-spin-button,
  #goto-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  #goto-input:focus { border-color: #4d90fe; }
  #goto-close { margin-left: auto; background: none; border: none; color: var(--status-text); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  #goto-close:hover { color: var(--text); }

  #statusbar {
    flex-shrink: 0;
    height: 22px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    background: var(--status-bg);
    border-top: 1px solid var(--status-border);
    color: var(--status-text);
    font-size: 11px;
    user-select: none;
  }
  #stat-spacer { flex: 1; }
  #stat-right {
    display: flex;
    gap: 12px;
  }

  /* ── Контекстное меню редактора (кастомное, вместо системного WKWebView) ── */
  #ctx-menu {
    position: fixed;
    min-width: 180px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    padding: 4px;
    z-index: 300;
    font-size: 13px;
  }
  #ctx-menu[hidden] { display: none; }
  .ctx-item {
    padding: 5px 10px;
    border-radius: 4px;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .ctx-item:hover { background: var(--hover-bg); }
  .ctx-sep {
    height: 1px;
    background: var(--panel-border);
    margin: 4px 2px;
  }

  /* ── Font Panel (floating) ── */
  #font-panel {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 680px;
    height: 300px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    z-index: 200;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
  }

  .font-panel-titlebar {
    display: flex;
    align-items: center;
    padding: 6px 10px;
    background: var(--panel-titlebar-bg, var(--panel-bg));
    border-bottom: 1px solid var(--panel-border);
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
  }
  .font-panel-titlebar:active { cursor: grabbing; }
  .font-panel-title {
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
  }
  .font-panel-close-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary, #888);
    padding: 0 2px;
    line-height: 1;
  }
  .font-panel-close-btn:hover { color: var(--text); }

  .font-panel-body {
    display: flex;
    flex-direction: row;
    flex: 1;
    padding: 6px 8px;
    gap: 6px;
    overflow: hidden;
    box-sizing: border-box;
  }

  .font-col {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .font-col-label {
    font-size: 11px;
    color: var(--text-secondary, #888);
    padding: 0 4px 3px 4px;
    flex-shrink: 0;
  }
  .font-col-collections { width: 120px; flex-shrink: 0; }
  .font-col-families    { flex: 1; min-width: 0; }
  .font-col-faces       { width: 130px; flex-shrink: 0; }
  .font-preview-col {
    width: 140px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #font-collections,
  #font-families,
  #font-faces {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex: 1;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: var(--input-bg, var(--bg));
  }
  .font-collection-item,
  .font-family-item,
  .font-face-item {
    padding: 3px 8px;
    font-size: 12px;
    cursor: default;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .font-collection-item:hover,
  .font-family-item:hover,
  .font-face-item:hover  { background: var(--hover-bg, rgba(0,0,0,0.06)); }
  .font-collection-item.active,
  .font-family-item.active,
  .font-face-item.active {
    background: var(--accent, #0071e3);
    color: #fff;
  }

  .font-search-wrap { flex-shrink: 0; padding-bottom: 4px; }
  #font-search {
    width: 100%;
    box-sizing: border-box;
    padding: 3px 7px;
    font-size: 12px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: var(--input-bg, var(--bg));
    color: var(--text);
    outline: none;
  }

  .font-size-row {
    display: flex;
    align-items: center;
    gap: 5px;
    padding-top: 6px;
    flex-shrink: 0;
  }
  .font-size-row label { font-size: 11px; color: var(--text-secondary,#888); flex-shrink:0; }
  #font-size-range { flex: 1; min-width: 0; }
  #font-size-input {
    width: 40px;
    padding: 2px 4px;
    font-size: 12px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: var(--input-bg, var(--bg));
    color: var(--text);
    text-align: right;
    flex-shrink: 0;
  }

  #font-preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: var(--input-bg, var(--bg));
    color: var(--text);
    overflow: hidden;
    padding: 4px;
    text-align: center;
    word-break: break-all;
  }

  .font-fav-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  #font-fav-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    line-height: 1;
    color: var(--text);
  }
  #font-fav-label {
    font-size: 11px;
    color: var(--text-secondary, #888);
  }

</style>
</head>
<body>
<div id="findbar" hidden>
  <div id="findbar-row1">
    <div id="find-field">
      <input id="find-input" type="text" placeholder="Find" data-i18n-ph="findPlaceholder" spellcheck="false" autocomplete="off">
      <span id="find-count"></span>
    </div>
    <div id="find-actions">
      <button id="find-prev" title="Previous (⌘⇧G)" data-i18n-title="findPrev">‹</button>
      <button id="find-next" title="Next (⌘G)" data-i18n-title="findNext">›</button>
      <button id="find-case" title="Match case" data-i18n-title="matchCase">Aa</button>
      <button id="find-close" title="Close" data-i18n-title="close">✕</button>
    </div>
  </div>
  <div id="findbar-row2" hidden>
    <div id="replace-field">
      <input id="replace-input" type="text" placeholder="Replace with" data-i18n-ph="replacePlaceholder" spellcheck="false" autocomplete="off">
    </div>
    <div id="replace-actions">
      <button id="replace-one" data-i18n="replaceOne">Replace</button>
      <button id="replace-all" data-i18n="replaceAll">Replace All</button>
    </div>
  </div>
</div>
<div id="gotobar" hidden>
  <input id="goto-input" type="number" min="1" placeholder="Line number" data-i18n-ph="gotoPlaceholder" spellcheck="false" autocomplete="off">
  <button id="goto-close" title="Close" data-i18n-title="close">✕</button>
</div>
<div id="editor-wrap">
  <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
</div>
<div id="ctx-menu" hidden>
  <div class="ctx-item" data-action="undo" data-i18n="undo">Undo</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="cut" data-i18n="cut">Cut</div>
  <div class="ctx-item" data-action="copy" data-i18n="copy">Copy</div>
  <div class="ctx-item" data-action="paste" data-i18n="paste">Paste</div>
  <div class="ctx-item" data-action="delete" data-i18n="delete">Delete</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="selectAll" data-i18n="selectAll">Select All</div>
</div>
<div id="statusbar">
  <span id="stat-pos"></span>
  <span id="stat-spacer"></span>
  <div id="stat-right">
    <span id="stat-lines"></span>
    <span id="stat-words"></span>
    <span id="stat-chars"></span>
  </div>
</div>


<script src="i18n.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
