<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Settings</title>
<style>
  :root {
    --bg: #ECECEC;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --label: #1d1d1f;
    --divider: #e0e0e2;
    --track: #d9d9dc;
    --seg-active-bg: #ffffff;
    --seg-shadow: rgba(0,0,0,0.14);
    --toggle-off: #d9d9dc;
    --toggle-on: #34c759;
    --toggle-knob: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a2a2c;
      --card-bg: #3a3a3c;
      --text: #f5f5f7;
      --label: #f5f5f7;
      --divider: #48484a;
      --track: #1c1c1e;
      --seg-active-bg: #636366;
      --seg-shadow: rgba(0,0,0,0.45);
      --toggle-off: #48484a;
      --toggle-on: #34c759;
      --toggle-knob: #ffffff;
    }
  }
  body.theme-light {
    --bg: #ECECEC; --card-bg: #ffffff; --text: #1d1d1f; --label: #1d1d1f;
    --divider: #e0e0e2; --track: #d9d9dc; --seg-active-bg: #ffffff;
    --seg-shadow: rgba(0,0,0,0.14); --toggle-off: #d9d9dc;
    --toggle-on: #34c759; --toggle-knob: #ffffff;
  }
  body.theme-dark {
    --bg: #2a2a2c; --card-bg: #3a3a3c; --text: #f5f5f7; --label: #f5f5f7;
    --divider: #48484a; --track: #1c1c1e; --seg-active-bg: #636366;
    --seg-shadow: rgba(0,0,0,0.45); --toggle-off: #48484a;
    --toggle-on: #34c759; --toggle-knob: #ffffff;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    min-height: 28px;
  }
  .row + .row {
    border-top: 1px solid var(--divider);
  }
  .row-label {
    font-size: 13px;
    color: var(--label);
  }
  .segment {
    display: inline-flex;
    background: var(--track);
    border-radius: 8px;
    padding: 2px;
  }
  .seg {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 4px 14px;
    border-radius: 6px;
    cursor: default;
    transition: background 0.12s ease;
  }
  .seg.active {
    background: var(--seg-active-bg);
    box-shadow: 0 1px 2.5px var(--seg-shadow);
  }
  .toggle {
    position: relative;
    width: 38px;
    height: 22px;
    border-radius: 11px;
    background: var(--toggle-off);
    cursor: default;
    transition: background 0.18s ease;
    flex-shrink: 0;
  }
  .toggle.on {
    background: var(--toggle-on);
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--toggle-knob);
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: transform 0.18s ease;
  }
  .toggle.on::after {
    transform: translateX(16px);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <span class="row-label" data-i18n="theme">Theme</span>
      <div class="segment" role="radiogroup">
        <button class="seg" data-theme="auto" data-i18n="themeAuto">Auto</button>
        <button class="seg" data-theme="light" data-i18n="themeLight">Light</button>
        <button class="seg" data-theme="dark" data-i18n="themeDark">Dark</button>
      </div>
    </div>
    <div class="row">
      <span class="row-label" data-i18n="useTabs">Use tabs</span>
      <div class="toggle" id="tabs-toggle" role="switch"></div>
    </div>
    <div class="row">
      <span class="row-label" data-i18n="showCounter">Line, word, and character count</span>
      <div class="toggle" id="counter-toggle" role="switch"></div>
    </div>
    <div class="row">
      <span class="row-label" data-i18n="autoName">Title from first line</span>
      <div class="toggle" id="autoname-toggle" role="switch"></div>
    </div>
  </div>
<script src="i18n.js"></script>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const { emit } = window.__TAURI__.event;
  const { getCurrentWindow } = window.__TAURI__.window;

  function applyWindowTheme(theme) {
    document.body.classList.remove("theme-light", "theme-dark");
    if (theme === "light") document.body.classList.add("theme-light");
    else if (theme === "dark") document.body.classList.add("theme-dark");
  }

  function setActiveSegment(theme) {
    document.querySelectorAll(".seg").forEach((b) => {
      b.classList.toggle("active", b.dataset.theme === theme);
    });
  }

  async function selectTheme(theme) {
    applyWindowTheme(theme);
    setActiveSegment(theme);
    try { await invoke("set_theme", { theme }); } catch (e) { console.error("set_theme:", e); }
    try { await emit("menu-theme", theme); } catch (e) { console.error("emit menu-theme:", e); }
  }

  document.querySelectorAll(".seg").forEach((b) => {
    b.addEventListener("click", () => selectTheme(b.dataset.theme));
  });

  // "Use tabs" toggle
  const tabsToggle = document.getElementById("tabs-toggle");
  function setToggleState(on) {
    tabsToggle.classList.toggle("on", on);
    tabsToggle.setAttribute("aria-checked", on ? "true" : "false");
  }
  tabsToggle.addEventListener("click", async () => {
    const next = !tabsToggle.classList.contains("on");
    setToggleState(next);
    try { await invoke("set_use_tabs", { enabled: next }); }
    catch (e) { console.error("set_use_tabs:", e); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { invoke("close_settings"); }
  });

  // Translate static text (data-i18n) before the window is shown, to avoid flicker
  window.I18N.localizeDOM();
  document.title = window.I18N.t("settingsTitle");

  // Init: theme from the URL, applied BEFORE show (no FOUC)
  const initial = new URLSearchParams(location.search).get("theme") || "auto";
  applyWindowTheme(initial);
  setActiveSegment(initial);

  // Tabs toggle: state from the config (async, after render; causes no flicker)
  invoke("get_use_tabs").then(setToggleState).catch((e) => console.error("get_use_tabs:", e));

  // "Word and character counter" toggle
  const counterToggle = document.getElementById("counter-toggle");
  function setCounterState(on) {
    counterToggle.classList.toggle("on", on);
    counterToggle.setAttribute("aria-checked", on ? "true" : "false");
  }
  counterToggle.addEventListener("click", async () => {
    const next = !counterToggle.classList.contains("on");
    setCounterState(next);
    try { await invoke("set_show_counter", { enabled: next }); }
    catch (e) { console.error("set_show_counter:", e); }
  });
  invoke("get_show_counter").then(setCounterState).catch((e) => console.error("get_show_counter:", e));

  // "Title from the first line" toggle
  const autonameToggle = document.getElementById("autoname-toggle");
  function setAutonameState(on) {
    autonameToggle.classList.toggle("on", on);
    autonameToggle.setAttribute("aria-checked", on ? "true" : "false");
  }
  autonameToggle.addEventListener("click", async () => {
    const next = !autonameToggle.classList.contains("on");
    setAutonameState(next);
    try { await invoke("set_auto_name", { enabled: next }); }
    catch (e) { console.error("set_auto_name:", e); }
    try { await emit("menu-auto-name", next); }
    catch (e) { console.error("emit menu-auto-name:", e); }
  });
  invoke("get_auto_name").then(setAutonameState).catch((e) => console.error("get_auto_name:", e));

  let shown = false;
  function showWindow() {
    if (shown) return;
    shown = true;
    getCurrentWindow().show().catch((e) => console.error("show:", e));
  }
  showWindow();
  setTimeout(showWindow, 100);
</script>
</body>
</html>
